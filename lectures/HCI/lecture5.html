<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bastien and Scapin - the 8 criteria</title>
<style>
:root{
  --paper:#EAF0F3; --surface:#FFFFFF; --surface2:#F3F7F9; --ink:#0E1D2A; --muted:#44586A; --line:#C8D4DC;
  --blue:#0B4F72; --blue-soft:#D6E7F1; --teal:#066A5F; --teal-soft:#D3EEE9;
  --coral:#B8341F; --coral-soft:#F9D9D2; --green:#1B7544; --green-soft:#D3EEDD;
  --amber:#8A5A00; --amber-soft:#FBECC8;
  --u: 1vh;                     /* vertical unit, rescaled by JS fitter */
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0B1620; --surface:#12212E; --surface2:#182B3A; --ink:#E7EEF3; --muted:#A3B5C3; --line:#2A3F50;
    --blue:#78BDE6; --blue-soft:#12354A; --teal:#56D3C1; --teal-soft:#0F3F3A;
    --coral:#FF8A74; --coral-soft:#4A211B; --green:#6AD79A; --green-soft:#153D28;
    --amber:#F6C453; --amber-soft:#443611;
  }
}
:root[data-theme="dark"]{
  --paper:#0B1620; --surface:#12212E; --surface2:#182B3A; --ink:#E7EEF3; --muted:#A3B5C3; --line:#2A3F50;
  --blue:#78BDE6; --blue-soft:#12354A; --teal:#56D3C1; --teal-soft:#0F3F3A;
  --coral:#FF8A74; --coral-soft:#4A211B; --green:#6AD79A; --green-soft:#153D28;
  --amber:#F6C453; --amber-soft:#443611;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--paper);color:var(--ink);
  font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}

/* ---------- frame ---------- */
#deck{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto}

header{display:flex;align-items:center;gap:calc(var(--u)*1.6);
  padding:calc(var(--u)*1.5) calc(var(--u)*2.6);background:var(--surface);
  border-bottom:1px solid var(--line)}
.cnum{flex:none;display:grid;place-items:center;width:calc(var(--u)*5.2);height:calc(var(--u)*5.2);
  border-radius:calc(var(--u)*1.2);background:var(--blue);color:var(--surface);
  font-weight:800;font-size:calc(var(--u)*2.5)}
.htxt{min-width:0;flex:1}
.hcrit{font-size:calc(var(--u)*2.7);font-weight:800;line-height:1.1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsub{font-size:calc(var(--u)*1.7);color:var(--muted);line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hpos{flex:none;text-align:right;font-size:calc(var(--u)*1.7);color:var(--muted);line-height:1.35}
.hpos b{display:block;font-size:calc(var(--u)*2.2);color:var(--ink)}
.hbtns{flex:none;display:flex;gap:calc(var(--u)*.8)}
.hbtns button{border:1px solid var(--line);background:var(--surface2);color:var(--muted);
  border-radius:calc(var(--u)*.9);padding:calc(var(--u)*.7) calc(var(--u)*1.2);
  font-size:calc(var(--u)*1.6);cursor:pointer;font-family:inherit}
.hbtns button:hover{background:var(--blue-soft);color:var(--blue)}

#stage{position:relative;min-height:0;overflow:hidden}
.slide{position:absolute;inset:0;padding:calc(var(--u)*2.4) calc(var(--u)*2.6);
  display:none;flex-direction:column;gap:calc(var(--u)*1.6);overflow:hidden}
.slide.on{display:flex}

footer{height:calc(var(--u)*.9);background:var(--surface2)}
#bar{height:100%;background:var(--blue);width:0;transition:width .18s ease}

/* ---------- shared blocks ---------- */
h1{font-size:calc(var(--u)*7);line-height:1.14;font-weight:800;letter-spacing:-.01em}
h2{font-size:calc(var(--u)*3.4);line-height:1.22;font-weight:800}
.lead{font-size:calc(var(--u)*2.5);line-height:1.35;color:var(--muted);max-width:62ch}
.chips{display:flex;flex-wrap:wrap;gap:calc(var(--u)*.9)}
.chip{background:var(--blue-soft);color:var(--blue);font-weight:700;
  font-size:calc(var(--u)*1.9);padding:calc(var(--u)*.6) calc(var(--u)*1.4);
  border-radius:999px;white-space:nowrap}

/* four-box criterion grid */
.q4{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;gap:calc(var(--u)*1.6)}
.cell{min-height:0;overflow:hidden;background:var(--surface);border:1px solid var(--line);
  border-radius:calc(var(--u)*1.6);padding:calc(var(--u)*1.7) calc(var(--u)*2);
  display:flex;flex-direction:column;gap:calc(var(--u)*.8);border-left:calc(var(--u)*.7) solid var(--blue)}
.cell.bad{border-left-color:var(--coral);background:var(--coral-soft)}
.cell.goal{border-left-color:var(--green);background:var(--green-soft)}
.cell.ask{border-left-color:var(--amber);background:var(--amber-soft)}
.k{font-size:calc(var(--u)*1.6);font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.cell.bad .k{color:var(--coral)} .cell.goal .k{color:var(--green)} .cell.ask .k{color:var(--amber)}
.v{font-size:calc(var(--u)*2.25);line-height:1.3}
.v em{font-style:normal;font-weight:700}

/* two-column example slide */
.two{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*2.2)}
.pane{min-height:0;display:flex;flex-direction:column;gap:calc(var(--u)*1.2);
  border-radius:calc(var(--u)*1.8);padding:calc(var(--u)*1.8) calc(var(--u)*2);overflow:hidden}
.pane.no{background:var(--coral-soft);border:calc(var(--u)*.35) dashed var(--coral)}
.pane.yes{background:var(--green-soft);border:calc(var(--u)*.35) solid var(--green)}
.tag{align-self:flex-start;font-size:calc(var(--u)*1.9);font-weight:800;letter-spacing:.1em;
  padding:calc(var(--u)*.5) calc(var(--u)*1.4);border-radius:999px;color:#fff}
.no .tag{background:var(--coral)} .yes .tag{background:var(--green)}
.cap{font-size:calc(var(--u)*2.1);font-weight:700;line-height:1.25}
.ui{flex:1;min-height:0;overflow:hidden;background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:calc(var(--u)*1.2);
  padding:calc(var(--u)*1.6);font-size:calc(var(--u)*2);line-height:1.4;
  display:flex;flex-direction:column;gap:calc(var(--u)*1.1);justify-content:center}
.why{font-size:calc(var(--u)*1.9);line-height:1.3}
.no .why{color:var(--coral)} .yes .why{color:var(--green)}
.why b{font-weight:800}

/* mini UI widgets inside .ui */
.lbl{font-size:calc(var(--u)*1.7);color:var(--muted);font-weight:700}
.fld{border:1px solid var(--line);border-radius:calc(var(--u)*.8);
  padding:calc(var(--u)*1) calc(var(--u)*1.2);background:var(--surface2);color:var(--muted)}
.bt{display:inline-block;background:var(--blue);color:#fff;font-weight:700;
  border-radius:calc(var(--u)*.8);padding:calc(var(--u)*1) calc(var(--u)*1.8);text-align:center}
.bt.grey{background:var(--muted)} .bt.red{background:var(--coral)}
.row{display:flex;gap:calc(var(--u)*1);align-items:center;flex-wrap:wrap}
.mono{font-family:Consolas,"Courier New",monospace}
.note{font-size:calc(var(--u)*1.7);color:var(--muted)}
.strike{text-decoration:line-through;opacity:.65}
ul.t{list-style:none;display:flex;flex-direction:column;gap:calc(var(--u)*.7)}
ul.t li{position:relative;padding-left:calc(var(--u)*2.4);font-size:calc(var(--u)*2)}
ul.t li::before{content:"";position:absolute;left:0;top:calc(var(--u)*.75);
  width:calc(var(--u)*1.1);height:calc(var(--u)*1.1);border-radius:50%;background:var(--blue)}

/* bridge slide: the 4 levels */
.levels{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--u)*1.6)}
.lv{min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:calc(var(--u)*1);
  background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--u)*1.6);
  padding:calc(var(--u)*1.8);position:relative}
.lv.hi{background:var(--blue);border-color:var(--blue)}
.lv.hi *{color:#fff!important}
.lvn{font-size:calc(var(--u)*1.6);font-weight:800;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.lvt{font-size:calc(var(--u)*2.7);font-weight:800;line-height:1.12}
.lvd{font-size:calc(var(--u)*1.95);line-height:1.3;color:var(--muted)}
.arrow{position:absolute;right:calc(var(--u)*-1.5);top:50%;transform:translateY(-50%);
  font-size:calc(var(--u)*2.6);color:var(--line);z-index:2;font-weight:800}

/* map slide */
.map{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);
  grid-template-rows:1fr 1fr;gap:calc(var(--u)*1.5)}
.mc{min-height:0;overflow:hidden;background:var(--surface);border:1px solid var(--line);
  border-top:calc(var(--u)*.7) solid var(--teal);border-radius:calc(var(--u)*1.4);
  padding:calc(var(--u)*1.5);display:flex;flex-direction:column;gap:calc(var(--u)*.7)}
/* text never gets squeezed by its flex parent: it overflows the box, so the fitter sees it */
.k,.v,.lvn,.lvt,.lvd,.mn,.mt,.md,.cap,.why,.tag,h1,h2,.lead,.by,.kbd,.chips{flex:none}
h1,h2,.lvt,.mt,.v,.lead,.cap{overflow-wrap:break-word}
.mn{font-size:calc(var(--u)*1.7);font-weight:800;color:var(--teal)}
.mt{font-size:calc(var(--u)*2.4);font-weight:800;line-height:1.12}
.md{font-size:calc(var(--u)*1.8);line-height:1.28;color:var(--muted)}

/* title slide */
.title{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;
  gap:calc(var(--u)*2.4)}
.by{font-size:calc(var(--u)*2.2);color:var(--muted)}
.kbd{font-size:calc(var(--u)*1.8);color:var(--muted)}
.kbd span{display:inline-block;border:1px solid var(--line);border-radius:calc(var(--u)*.6);
  padding:0 calc(var(--u)*.8);background:var(--surface);font-family:Consolas,monospace}

/* divider slide */
.divider{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:calc(var(--u)*1.8)}
.dn{font-size:calc(var(--u)*2);font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
ol.dsubs{list-style:none;counter-reset:d;display:flex;flex-wrap:wrap;gap:calc(var(--u)*1.2)}
ol.dsubs li{counter-increment:d;background:var(--surface);border:1px solid var(--line);
  border-left:calc(var(--u)*.6) solid var(--teal);border-radius:calc(var(--u)*1.1);
  padding:calc(var(--u)*1.1) calc(var(--u)*1.8);font-size:calc(var(--u)*2.2);font-weight:700}
ol.dsubs li::before{content:counter(d) " · ";color:var(--teal);font-weight:800}
/* mini widgets used in the examples */
.cols2{columns:2;font-size:calc(var(--u)*1.95);line-height:1.6}
.cols2 span{display:block;break-inside:avoid}
.grp{border:1px solid var(--line);border-radius:calc(var(--u)*.8);padding:calc(var(--u)*.8) calc(var(--u)*1.2);
  font-size:calc(var(--u)*1.95)}
.grp b{display:block;font-size:calc(var(--u)*1.6);color:var(--teal);text-transform:uppercase;letter-spacing:.06em}
.pbar{height:calc(var(--u)*1.4);border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface2)}
.pbar i{display:block;height:100%;background:var(--blue)}
.steps{display:flex;gap:calc(var(--u)*.8)}
.steps i{display:grid;place-items:center;width:calc(var(--u)*3.4);height:calc(var(--u)*3.4);border-radius:50%;
  background:var(--blue-soft);color:var(--blue);font-style:normal;font-weight:800;font-size:calc(var(--u)*1.8)}
.dense{display:grid;grid-template-columns:repeat(7,1fr);gap:calc(var(--u)*.6)}
.dense u{display:block;height:calc(var(--u)*1.4);background:var(--line);border-radius:calc(var(--u)*.3)}
.win{border:1px solid var(--line);border-radius:calc(var(--u)*.8);overflow:hidden;display:flex;flex-direction:column;gap:0}
.winbar{background:var(--surface2);padding:calc(var(--u)*.7) calc(var(--u)*1.1);font-size:calc(var(--u)*1.6);color:var(--muted)}
.wintabs{display:flex;gap:calc(var(--u)*.6);padding:calc(var(--u)*.7) calc(var(--u)*1.1);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.wintabs span{background:var(--blue-soft);color:var(--blue);border-radius:calc(var(--u)*.6);
  padding:calc(var(--u)*.4) calc(var(--u)*1);font-size:calc(var(--u)*1.7);font-weight:700}
.win .note{padding:calc(var(--u)*.7) calc(var(--u)*1.1)}

/* overview */
#ov{position:fixed;inset:0;background:var(--paper);z-index:50;display:none;
  grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;padding:18px;
  overflow:auto;align-content:start}
#ov.on{display:grid}
#ov button{text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:10px;padding:10px 12px;cursor:pointer;font-family:inherit;font-size:13px;line-height:1.3}
#ov button:hover{border-color:var(--blue);background:var(--blue-soft)}
#ov button i{display:block;font-style:normal;font-size:11px;color:var(--muted);margin-bottom:3px}
#ov button b{font-weight:700}
@media print{html,body{overflow:visible}.slide{position:relative;display:flex!important;
  page-break-after:always;height:100vh}#ov,.hbtns{display:none}}
</style>
</head>
<body>

<div id="deck">
  <header>
    <span class="cnum" id="h-num">—</span>
    <span class="htxt"><span class="hcrit" id="h-crit">Bastien and Scapin</span>
      <span class="hsub" id="h-sub">The 8 ergonomic criteria</span></span>
    <span class="hpos"><b id="h-step">1 / 19</b><span id="h-part">Opening</span></span>
    <span class="hbtns">
      <button type="button" id="b-ov" title="All slides (Esc)">All slides</button>
      <button type="button" id="b-fs" title="Full screen (F)">Full screen</button>
      <button type="button" id="b-th" title="Light / dark">Dark</button>
    </span>
  </header>

  <div id="stage"><!-- slides injected --></div>

  <footer><div id="bar"></div></footer>
</div>

<div id="ov"></div>

<script>
/* ============ CONTENT ============ */
/* 8 criteria, 18 sub-criteria. Each sub-criterion: an explanation and an example. */
var CRIT = [
{n:1, name:"Guidance", one:"Advise, orient, inform and lead the user.", subs:[
 {t:"Prompting",
  when:"On every screen where the user must act or type: forms, search boxes, empty pages, the first use of an app.",
  ask:"Does the user know what to do now, and in which format?",
  fail:"The user hesitates, types in the wrong format, or does not see the next step.",
  goal:"Lead the user to the right action with format hints, examples and default values &mdash; without manipulating them.",
  cap0:"A field with no hint",
  ui0:'<div class="lbl">Date</div><div class="fld">&nbsp;</div><div class="row"><span class="bt">Continue</span></div>'+
      '<div class="note" style="color:var(--coral)">The user types 10/11 &rarr; error, with no explanation.</div>',
  why0:"No format, no example. The user guesses, then is punished for guessing wrong.",
  cap1:"Label, format and example",
  ui1:'<div class="lbl">Date of birth</div><div class="fld">dd / mm / yyyy</div>'+
      '<div class="note">Example: 25/03/2001</div><div class="row"><span class="bt">Continue</span></div>',
  why1:"The format is visible <b>before</b> the error, so the error does not happen."},
 {t:"Grouping and distinction between items",
  when:"When a screen shows many items: forms, menus, toolbars, settings pages, dashboards.",
  ask:"Can the user see which items belong together, and which are different?",
  fail:"Items are mixed, so the user searches for a long time or clicks the wrong one.",
  goal:"Group related items by position and by format (boxes, spacing, colour) so the structure is visible at a glance. Groups must be named.",
  cap0:"One flat list of ten fields",
  ui0:'<div class="cols2"><span>Name</span><span>Expiry</span><span>Surname</span><span>Phone</span>'+
      '<span>Street</span><span>Email</span><span>City</span><span>Postcode</span>'+
      '<span>Card number</span><span>Country</span></div>',
  why0:"Nothing shows that the card number is not part of the address. The eye has no structure to follow.",
  cap1:"Three named groups",
  ui1:'<div class="grp"><b>Identity</b> Name, Surname</div>'+
      '<div class="grp"><b>Address</b> Street, City, Postcode, Country</div>'+
      '<div class="grp"><b>Payment</b> Card number, Expiry</div>',
  why1:"Position and format carry the meaning, and each group is correctly named."},
 {t:"Immediate feedback",
  when:"After every user action: a click, a key press, a submit, a long operation (upload, payment, download).",
  ask:"After I act, does the system show at once that it received my action, and what is happening?",
  fail:"The user does not know whether the action worked, so they click again or leave.",
  goal:"Answer every action quickly: a state change, a message, a progress bar. Short wait &rarr; change the cursor. Long wait (&gt; 5 s) &rarr; show progress.",
  cap0:"Nothing happens",
  ui0:'<div class="row"><span class="bt">Pay 4 500 DA</span></div><div class="note">&nbsp;</div>'+
      '<div class="note" style="color:var(--coral)">No message, no change. The user clicks again &mdash; and pays twice.</div>',
  why0:"Silence is read as failure. The user repeats the action.",
  cap1:"Received, in progress, done",
  ui1:'<div class="row"><span class="bt grey">Paying&hellip;</span></div>'+
      '<div class="pbar"><i style="width:64%"></i></div>'+
      '<div class="note" style="color:var(--green)">&#10003; Paid. Receipt sent to your email.</div>',
  why1:"The button changes state, the bar shows progress, a message confirms the end."},
 {t:"Legibility",
  when:"Wherever there is text to read: body text, labels, buttons, messages, small screens.",
  ask:"Can every user read this easily &mdash; size, contrast, font, line length?",
  fail:"The user strains to read, misreads, or gives up.",
  goal:"Normal case, enough size, enough contrast (WCAG: at least 4.5:1 for normal text), clear sans-serif fonts, short lines.",
  cap0:"Light grey, small, all capitals",
  ui0:'<div style="color:#b9c2c9;font-size:calc(var(--u)*1.5);text-transform:uppercase;line-height:1.25">'+
      'PLEASE READ THESE CONDITIONS CAREFULLY BEFORE YOU CONFIRM YOUR ORDER BECAUSE THEY APPLY TO EVERY PURCHASE</div>',
  why0:"Capitals remove the word shape, the contrast is far below 4.5:1, and the line is too long.",
  cap1:"Normal case, strong contrast",
  ui1:'<div style="line-height:1.4">Please read these conditions before you confirm your order. '+
      'They apply to every purchase.</div>',
  why1:"Same message, read in one glance, by everyone."}
]},
{n:2, name:"Workload", one:"Reduce the perceptual and memory load; make the dialogue efficient.", subs:[
 {t:"Brevity: concision",
  when:"In all short texts and inputs: labels, menu items, buttons, codes the user must type.",
  ask:"Are the texts and the inputs as short as possible while staying clear?",
  fail:"The user reads too much or types too much, and misses what matters.",
  goal:"Short labels, abbreviations only if they are already known, default values the user does not have to retype.",
  cap0:"Forty words to say two things",
  ui0:'<div class="note" style="font-size:calc(var(--u)*1.9);line-height:1.35">&ldquo;An error has unfortunately '+
      'occurred while the system was attempting to carry out the operation that you requested, and as a result '+
      'we are not able to proceed with saving your document at this time.&rdquo;</div>'+
      '<div class="row"><span class="bt">Click here in order to validate your registration</span></div>',
  why0:"A tooltip shows for about half a second. Nobody finishes this sentence.",
  cap1:"Cause, then solution",
  ui1:'<div class="v"><b>Save failed.</b> The disk is full.<br>Free some space and try again.</div>'+
      '<div class="row"><span class="bt">Register</span></div>',
  why1:"Eleven words, and the button says what it does."},
 {t:"Brevity: minimal actions",
  when:"For the frequent tasks the user repeats: search, buy, send, log in, change a setting.",
  ask:"How many steps, clicks or screens are needed to reach the goal? Can we remove some?",
  fail:"The task takes too long, the user is tired, and abandons before the end.",
  goal:"Reduce the number of actions to the minimum the goal really needs, and offer shortcuts.",
  cap0:"Six screens to change a password",
  ui0:'<div class="steps"><i>1</i><i>2</i><i>3</i><i>4</i><i>5</i><i>6</i></div>'+
      '<div class="note">Menu &rarr; Account &rarr; Security &rarr; Password &rarr; Confirm identity &rarr; New password</div>',
  why0:"Five of the six screens carry no decision. They only exist because of the menu structure.",
  cap1:"Two steps, from anywhere",
  ui1:'<div class="steps"><i>1</i><i>2</i></div>'+
      '<div class="note">Account &rarr; Change password (and the same link in the settings search)</div>',
  why1:"Count the actions for the same task. Fewer actions, same result."},
 {t:"Information density",
  when:"On screens with a lot of information: dashboards, home pages, tables, admin panels.",
  ask:"Is there too much, or too little, on this screen? Is only the useful information shown?",
  fail:"The user is overloaded and cannot find what matters, or has to open many screens to gather it.",
  goal:"Show only what the task needs, close to where it is used. Limit the quantity, structure it, display it just in time.",
  cap0:"Forty links and five banners",
  ui0:'<div class="dense">'+Array(28).join(0).split('').map(function(){return '<u></u>';}).join('')+'</div>'+
      '<div class="note" style="color:var(--coral)">Everything has the same weight, so nothing stands out.</div>',
  why0:"Quantity without structure. The user scans, gives up, and uses the search box instead.",
  cap1:"One task in front, the rest one click away",
  ui1:'<div class="row"><span class="bt">Find a car</span></div>'+
      '<div class="note">Three shortcuts: New &middot; Used &middot; By budget</div>'+
      '<div class="note">Everything else lives in the menu, shown when it is needed.</div>',

var S=[];   /* {part, num, crit, sub, html} */
var TOTSUB=0; CRIT.forEach(function(c){TOTSUB+=c.subs.length;});

  '<div class="levels">'+

   '<div class="lv"><div class="lvn">Level 2</div><div class="lvt">800 recommendations</div>'+

    'contradict each other.</div></div>'+
   '<div class="lv hi"><div class="lvn">Level 3</div><div class="lvt">The 8 criteria</div>'+
    '<div class="lvd">Bastien and Scapin group and arbitrate those rules. This is the level we work at: a compact, '+
    'usable, shared vocabulary.</div></div>'+
   '<div class="lv"><div class="lvn">Level 4</div><div class="lvt">The risk</div>'+
    '<div class="lvd">What happens when they are ignored (Meinadier): confusion, errors, frustration, stress, '+
    'and rejection of the system.</div></div></div>'+
  '<div class="note" style="font-size:calc(var(--u)*2)">In one sentence: the criteria are the ergonomic theories '+
  'made short enough to use, and precise enough to name the fault in a report.</div>'});

    '<div class="mt">'+c.name+'</div><div class="md">'+

CRIT.forEach(function(c){
  var m=c.subs.length;
  /* section divider */
  S.push({part:"Criterion "+c.n, num:c.n, crit:c.name,
   sub:(m>1? m+" sub-criteria" : "1 sub-criterion"),

     '<ol class="dsubs">'+c.subs.map(function(s){return '<li>'+s.t+'</li>';}).join('')+'</ol></div>'});

  c.subs.forEach(function(s,j){
    var tag = m>1 ? (c.n+'.'+(j+1)) : String(c.n);

       '<div class="cell"><div class="k">1 &middot; When it applies</div><div class="v">'+s.when+'</div></div>'+

   '<div class="cell"><div class="k">1 &middot; Situation</div><div class="v">Which screen, which user, which task.</div></div>'+

/* ============ ENGINE ============ */
var stage=document.getElementById('stage'), i=0;
S.forEach(function(s,k){
  var d=document.createElement('section');
  d.className='slide'; d.id='sl'+k; d.innerHTML=s.html; stage.appendChild(d);
});
var EL=[].slice.call(stage.children);

var hNum=document.getElementById('h-num'), hCrit=document.getElementById('h-crit'),
    hSub=document.getElementById('h-sub'), hStep=document.getElementById('h-step'),
    hPart=document.getElementById('h-part'), bar=document.getElementById('bar');

function fit(el){
  /* set the vertical unit so the slide fills the screen without ever scrolling */
  var MIN=0.45, MAX=2.00, STEP=0.04;
  var kids=el.querySelectorAll('.cell,.ui,.mc,.lv,.pane,.win,.grp,.lvt,.mt,.v,.lead,.cap,.why,h1,h2');
  function over(){
    if(el.scrollHeight>el.clientHeight+2 || el.scrollWidth>el.clientWidth+2) return true;
    for(var n=0;n<kids.length;n++){                 /* catch text clipped inside a box */
      if(kids[n].scrollHeight>kids[n].clientHeight+2) return true;
      if(kids[n].scrollWidth >kids[n].clientWidth +2) return true;
    }
    return false;
  }
  var u=1.0, t=0;
  el.style.setProperty('--u', u+'vh');
  if(over()){                                   /* too big: shrink until it fits */
    while(t<60 && u>MIN && over()){ u-=STEP; el.style.setProperty('--u', u+'vh'); t++; }
  } else {                                      /* room left: grow until it would overflow */
    while(t<60 && u<MAX){
      u+=STEP; el.style.setProperty('--u', u+'vh'); t++;
      if(over()){ u-=STEP; el.style.setProperty('--u', u+'vh'); break; }
    }
  }
}
function show(k){
  i=Math.max(0, Math.min(S.length-1, k));
  EL.forEach(function(e,n){ e.classList.toggle('on', n===i); });
  var s=S[i];
  hNum.textContent = s.num===''? '·' : s.num;
  hNum.style.background = s.num===''? 'var(--muted)' : 'var(--blue)';
  hCrit.textContent=s.crit; hSub.textContent=s.sub;
  hStep.textContent=(i+1)+' / '+S.length; hPart.textContent=s.part;
  bar.style.width=((i+1)/S.length*100)+'%';
  fit(EL[i]);
  try{ location.hash='s'+(i+1); }catch(e){}
}
function go(d){ show(i+d); }

document.addEventListener('keydown', function(e){
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){ e.preventDefault(); go(1); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); go(-1); }
  else if(e.key==='Home'){ show(0); } else if(e.key==='End'){ show(S.length-1); }
  else if(e.key==='Escape'){ ov.classList.toggle('on'); }
  else if(e.key==='f'||e.key==='F'){ fsToggle(); }
});
stage.addEventListener('click', function(e){
  go(e.clientX < window.innerWidth*0.25 ? -1 : 1);
});
var tx=null;
stage.addEventListener('touchstart',function(e){tx=e.touches[0].clientX;},{passive:true});
stage.addEventListener('touchend',function(e){
  if(tx===null)return; var dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>40) go(dx<0?1:-1); tx=null;
},{passive:true});

function fsToggle(){
  if(!document.fullscreenElement){ document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); }
  else { document.exitFullscreen&&document.exitFullscreen(); }
}
document.getElementById('b-fs').onclick=function(e){e.stopPropagation();fsToggle();};
document.getElementById('b-th').onclick=function(e){e.stopPropagation();
  var r=document.documentElement, cur=r.getAttribute('data-theme');
  r.setAttribute('data-theme', cur==='dark'?'light':'dark'); setTimeout(function(){fit(EL[i]);},30);
};

var ov=document.getElementById('ov');
ov.innerHTML=S.map(function(s,k){
  return '<button type="button" data-k="'+k+'"><i>'+(k+1)+' · '+s.part+'</i><b>'+s.crit+'</b></button>';
}).join('');
ov.addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b)return;
  ov.classList.remove('on'); show(+b.dataset.k);
});
